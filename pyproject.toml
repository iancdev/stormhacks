[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forza-ai"
version = "0.1.0"
description = "Human-pedals, AI-steering behavior cloning pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
training = ["torch>=2.2"]
test = ["pytest>=8", "opencv-python>=4.10"]
analytics = ["psycopg[binary]>=3.1", "matplotlib>=3.8"]
voice = ["sounddevice>=0.4", "google-genai>=2.25"]
hardware = [
  "comtypes; sys_platform == 'win32'",
  "dxcam==0.3.0; sys_platform == 'win32'",
  "opencv-python>=4.10; sys_platform == 'win32'",
  "PySDL2==0.9.17; sys_platform == 'win32'",
  "pysdl2-dll==2.32.10; sys_platform == 'win32'",
  "pyvjoyffb==0.4; sys_platform == 'win32'",
]

[project.scripts]
forza-train = "forza_ai.training.cli:main"
forza-run = "forza_ai.runtime:main"
forza-launch = "forza_ai.launch:main"
forza-report = "forza_ai.metrics:main"
forza-analytics = "forza_ai.analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"forza_ai.data" = ["exclude_sessions.txt"]
